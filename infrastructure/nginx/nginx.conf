# ==============================================================================
# CONFIGURATION NGINX - FT_TRANSCENDENCE
# ==============================================================================
# Rôle : Reverse Proxy & Terminaison SSL
# Description :
# Ce serveur agit comme point d'd'entrée unique pour l'infrastructure.
# Il gère le chiffrement SSL (via les certificats Vault) et route le trafic
# vers les microservices appropriés (Frontend ou API Gateway).
# ==============================================================================

events {
    # Nombre maximum de connexions simultanées par worker
    worker_connections 1024;
}

http {
    # --- CONFIGURATION Mime-Types & Logs ---
    include         mime.types;
    default_type    application/octet-stream;

    # Format de log étendu pour faciliter le débogage et l'audit
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent" "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/access.log         main;
    error_log   /var/log/nginx/error.log    warn;

    # --- OPTIMISATIONS RÉSEAU ---
    sendfile            on; # Améliore la vitesse de transfert de fichiers statiques
    keepalive_timeout   65; # Maintient la connexion active pour les requêtes successives

    # ==========================================================================
    # SERVEUR 1 : REDIRECTION HTTP -> HTTPS
    # ==========================================================================
    server {
        listen  80;
        # Ne pas oublier d'ajouter `transcendence.localhost` dans le fichier '/etc/hosts'
        # sur la machine hôte (et non pas dans le conteneur) pour que le navigateur puisse
        # résoudre l'adresse :
        #
        # ```text
        # 127.0.0.1 transcendence.localhost
        # ```
        #
        server_name transcendence.localhost;

        # Sécurité : On force le passage en HTTPS pour toutes les requêtes.
        # Code 301 = Redirection permanente.
        return 301 https://$host$request_uri;
    }

    # ==========================================================================
    # SERVEUR 2 : HTTPS PRINCIPAL (REVERSE PROXY)
    # ==========================================================================
    server {
        # Activation explicite du module SSL sur le port 443
        listen  443 ssl;
        server_name transcendence.localhost;

        # ----------------------------------------------------------------------
        # TERMINAISON SSL/TLS
        # ----------------------------------------------------------------------
        # Les certificats sont générés par 'vault-init' et montés en lecture seule.
        # Le volume Docker associé est : certs_data:/etc/nginx/certs
        ssl_certificate     /etc/nginx/certs/transcendence.crt;
        ssl_certificate_key /etc/nginx/certs/transcendence.key;

        # Durcissement de la configuration SSL
        ssl_protocols   TLSv1.2 TLSv1.3;
        ssl_ciphers     HIGH:!aNULL:!MD5;

        # ----------------------------------------------------------------------
        # ROUTAGE DYNAMIQUE & BACKENDS
        # ----------------------------------------------------------------------

        # NOTE TECHNIQUE SUR LE RESOLVER :
        # Nous utilisons le DNS interne de Docker (127.0.0.11) pour résoudre
        # les noms de services (gateway, frontend) au moment de la requête.
        # Cela empêche Nginx de crasher au démarrage si les services upstreams
        # ne sont pas encore prêts (ou n'existent pas encore).
        resolver 127.0.0.11 valid=30s;


        # --- ROUTE : API GATEWAY (BACKEND) ---
        location /api/ {
            # Utilisation d'une variable pour la résolution tardive (Lazy Resolution)
            resolver 127.0.0.11 valid=30s;
            set $upstream_gateway http://gateway:3000;

            proxy_pass $upstream_gateway;

            # Propagation des en-têtes originaux pour que le backend connaisse
            # l'IP réelle du client et le protocole utilisé.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- ROUTE : FRONTEND (SPA / STATIC) ---
        location / {
            resolver 127.0.0.11 valid=30s;
            set $upstream_frontend http://frontend:3000;

            proxy_pass $upstream_frontend;
            
            proxy_set_header Host $host;
            
            # Support des WebSockets (Nécessaire pour le HMR en dev et le jeu temps réel)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
