apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  ports:
    - port: 42920 # default port: 9200
      targetPort: 9200
      name: http
  selector:
    app: elasticsearch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
spec:
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "elastic-role"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/infra/elastic"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/infra/elastic" -}}
            export ELASTIC_PASSWORD={{ .Data.data.password | toJSON }}
          {{- end -}}
    spec:
      serviceAccountName: elasticsearch
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "true"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          command: ["/bin/sh", "-c"]
          args: [". /vault/secrets/config && /usr/local/bin/docker-entrypoint.sh eswrapper"]
          ports:
            - containerPort: 9200