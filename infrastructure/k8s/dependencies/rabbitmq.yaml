apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  ports:
    - port: 42672 # default port: 5672
      name: amqp
    - port: 42673 # default port: 15672
      name: management
  selector:
    app: rabbitmq
---
apiVersion: v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
    template:
      metadata:
        labels:
          app: rabbitmq
        annotations:
          # Injection du secret RabbitMQ depuis Vault
          vault.hashicorp.com/agent-inject: "true"
          vault.hashicorp.com/role: "rabbitmq-role"
          vault.hashicorp.com/agent-inject-secret-config: "secret/data/infra/rabbitmq"
          vault.hashicorp.com/agent-inject-template-config: |
            {{- with secret "secret/data/infra/rabbitmq" -}}
              export RABBITMQ_DEFAULT_USER="{{ .Data.data.user }}"
              export RABBITMQ_DEFAULT_PASS="{{ .Data.data.password }}"
            {{- end -}}
      spec:
        serviceAccountName: default
        containers:
          - name: rabbitmq
            image: rabbitmq:3.13-management
            # On utilise le fichier injecte pour definir les variables d'environnement au demarrage
            command: ["/bin/sh", "-c"]
            args: ["source /vault/secrets/config && docker-entrypoint.sh rabbitmq-server"]
            ports:
              - containerPort: 42672
              - containerPort: 42673