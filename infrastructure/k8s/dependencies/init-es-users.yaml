apiVersion: batch/v1
kind: Job
metadata:
  name: init-es-users
  annotations:
    # On utilise un hook Helm ou on le laisse gérer par Make,
    # mais ici c'est un Job standard
spec:
  ttlSecondsAfterFinished: 60 # Le pod se supprimera 60s après succès
  template:
    metadata:
      annotations:
        # Injection Vault
        vault.hashicorp.com/agent-inject: "true"
        # On utilise le rôle kibana car il a accès aux deux secrets nécessaires
        vault.hashicorp.com/role: "kibana-role"
        vault.hashicorp.com/agent-pre-populate-only: "true"

        # Récupérer le mot de passe ROOT Elastic
        vault.hashicorp.com/agent-inject-secret-elastic: "secret/data/infra/elastic"
        vault.hashicorp.com/agent-inject-template-elastic: |
          {{- with secret "secret/data/infra/elastic" -}}
            export ELASTIC_PASSWORD="{{ .Data.data.password }}"
          {{- end -}}

        # Récupérer le mot de passe SYSTEM Kibana (celui qu'on veut définir)
        vault.hashicorp.com/agent-inject-secret-kibana: "secret/data/infra/kibana"
        vault.hashicorp.com/agent-inject-template-kibana: |
          {{- with secret "secret/data/infra/kibana" -}}
            export KIBANA_SYSTEM_PASSWORD="{{ .Data.data.password }}"
          {{- end -}}

    spec:
      serviceAccountName: kibana # Doit correspondre au rôle Vault
      restartPolicy: OnFailure
      containers:
      - name: init-users
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Chargement des secrets..."
            . /vault/secrets/elastic
            . /vault/secrets/kibana

            echo "Attente de la disponibilité d'Elasticsearch..."
            until curl -s -u "elastic:$ELASTIC_PASSWORD" http://elasticsearch:42920/_cluster/health | grep -q '"status":"green"\|"status":"yellow"'; do
              echo "   ... Elasticsearch n'est pas encore prêt. Nouvelle tentative dans 5s."
              sleep 5
            done

            echo "Elasticsearch est UP !"
            echo "Configuration du mot de passe pour l'utilisateur 'kibana_system'..."

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -u "elastic:$ELASTIC_PASSWORD" \
              -H "Content-Type: application/json" \
              -d "{\"password\":\"$KIBANA_SYSTEM_PASSWORD\"}" \
              http://elasticsearch:42920/_security/user/kibana_system/_password)

            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "Succès : Mot de passe kibana_system mis à jour."
              exit 0
            else
              echo "Erreur : Impossible de changer le mot de passe (Code HTTP: $HTTP_CODE)"
              exit 1
            fi