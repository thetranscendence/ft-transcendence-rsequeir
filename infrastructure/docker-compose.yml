# ==============================================================================
# DOCKER COMPOSE - INFRASTRUCTURE FT_TRANSCENDENCE
# ==============================================================================
# Ce fichier orchestre les services d'infrastructure (Backing Services).
# Il ne contient PAS le code applicatif (Frontend/Backend), mais fournit
# les briques de base : Sécurité (Vault), Messagerie (RabbitMQ) et Ingress (Nginx).
# ==============================================================================

services:
  # ==============================================================================
  # SERVICE: HASHICORP VAULT
  # Module: Cybersecurity (Gestion des secrets & PKI)
  # Rôle : Gestionnaire de secrets & Autorité de Certification (PKI) interne.
  # ==============================================================================
  vault:
    # Utilisation d'une version épinglée (pinned version) pour la stabilité.
    image: hashicorp/vault:1.13.3
    container_name: vault

    # Exposition des ports :
    # 8200 : API Vault et Interface Web (UI)
    ports:
      - "8200:8200"

    environment:
      # --------------------------------------------------------------------------
      # CONFIGURATION DE DÉVELOPPEMENT
      # --------------------------------------------------------------------------
      # --- MODE DÉVELOPPEMENT ---
      # Injection du Root Token depuis le .env (non commité).
      # Permet l'automatisation via 'vault-init' sans intervention humaine.
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_ROOT_TOKEN}
      
      # Écoute sur toutes les interfaces (0.0.0.0) pour être accessible par
      # les autres conteneurs du réseau Docker.
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      
      # Adresse publique annoncée pour l'API (interne au cluster)
      - VAULT_API_ADDR=http://127.0.0.1:8200
    
    # --- SÉCURITÉ MÉMOIRE (SWAP) ---
    # IPC_LOCK est crucial pour un coffre-fort de secrets.
    # Il permet de verrouiller la mémoire vive (mlock) pour empêcher que les
    # secrets déchiffrés en RAM ne soient écrits sur le disque dur (SWAP)
    # si le serveur manque de mémoire.
    cap_add:
      - IPC_LOCK 
    
    # Mode 'server -dev' :
    # - Stockage 100% en RAM (pas de persistance sur disque).
    # - Unseal automatique (pas besoin de clés de déverrouillage manuelles).
    command: server -dev

  # ============================================================================
  # 2. INITIALISATION AUTOMATISÉE (Bootstrapper)
  # Rôle : Service éphémère ("One-off").
  # Description : 
  #   Ce conteneur se lance, configure Vault, génère les certificats SSL/TLS,
  #   crée les mots de passe aléatoires, les dépose dans les volumes partagés,
  #   puis s'éteint immédiatement.
  # ============================================================================
  vault-init:
    image: hashicorp/vault:1.13.3
    container_name: vault_init

    # Pas de redémarrage automatique : une fois le travail fini, il doit rester éteint.
    restart: "no"

    # Script inline pour installer les dépendances (jq, openssl) à la volée
    # et lancer le script d'init. Cela évite de devoir build une image custom.
    entrypoint: >
      /bin/sh -c "apk add --no-cache jq openssl && chmod +x /scripts/init_vault.sh && /scripts/init_vault.sh"

    environment:
      - VAULT_ROOT_TOKEN=${VAULT_ROOT_TOKEN}
      # Variables nécessaires pour injecter les configs initiales dans Vault
      - RABBITMQ_USER=${RABBITMQ_USER}
      - POSTGRES_USER=${POSTGRES_USER}
      - NODE_ENV=${NODE_ENV}

    volumes:
      # Injection du script Shell d'initialisation
      - ./vault/init_vault.sh:/scripts/init_vault.sh
      # Volumes de sortie (écriture) pour les artéfacts générés
      - certs_data:/shared/certs
      - secrets_data:/shared/secrets

    # Attendre que Vault soit prêt à recevoir des commandes API
    depends_on:
      - vault

  # ============================================================================
  # 3. BROKER DE MESSAGES (RabbitMQ)
  # Module: Devops / Microservices (V.7)
  # Rôle : Bus d'événements asynchrone (Pub/Sub).
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    hostname: rabbitmq

    ports:
      - "5672:5672"   # Protocole AMQP (Communication inter-services)
      - "15672:15672" # Dashboard de management (http://localhost:15672)

    environment:
      # L'utilisateur est public (défini dans .env)
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      # SÉCURITÉ : On n'injecte PAS le mot de passe en variable d'environnement.
      # On indique à RabbitMQ de lire le contenu du fichier situé dans le volume RAM.
      # [Ref: Docker Secrets pattern]
      - RABBITMQ_DEFAULT_PASS=/shared/secrets/rabbitmq_password

    volumes:
      # Persistance des données RabbitMQ (Queues, Messages durables)
      - rabbitmq_data:/var/lib/rabbitmq
      # Montage en lecture seule (:ro) des secrets générés par vault-init
      - secrets_data:/shared/secrets:ro

    # HEALTHCHECK :
    # Indispensable dans une architecture microservices.
    # Les services Backend (NestJS) attendront que RabbitMQ soit "Healthy"
    # avant de tenter de se connecter, évitant les crash loops au démarrage.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Dépendance forte : Le mot de passe doit exister avant le lancement.
    depends_on:
      vault-init:
        condition: service_completed_successfully

  # ============================================================================
  # 4. REVERSE PROXY & SSL (Nginx)
  # Module: Cybersecurity (V.6) & Web (V.2)
  # Rôle : Gateway d'entrée unique, terminaison SSL, routage.
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: unless-stopped

    ports:
      # Mapping 1443 -> 443 pour éviter les conflits de ports priviligiés sur l'hôte
      # ou si un autre serveur web tourne déjà sur le port 443 de la machine.
      - "1443:443"  # Accès HTTPS : https://localhost:1443
      - "8080:80"   # Accès HTTP (redirigé)

    volumes:
      # Configuration Nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certificats SSL (montés en lecture seule)
      - certs_data:/etc/nginx/certs:ro

    # Nginx ne doit démarrer que lorsque les certificats SSL ont été générés
    depends_on:
      vault-init:
        condition: service_completed_successfully

    networks:
      - transcendence-net

  # ============================================================================
  # 5. API GATEWAY (Backend Principal)
  # Module: Web (V.2)
  # Rôle : Point d'entrée API, Validation, Auth & Proxy vers microservices.
  # ============================================================================
  gateway:
    container_name: gateway
    build:
      # Le contexte est la racine du projet pour accéder au workspace pnpm
      context: ..
      dockerfile: apps/backend-gateway/Dockerfile

    restart: unless-stopped

    # Montage des volumes pour le Hot-Reload
    # On monte le code source local par-dessus celui du conteneur
    volumes:
      - ../apps/backend-gateway/src:/usr/src/app/backend-gateway/src
      # On exclut node_modules pour utiliser ceux du conteneur et pas ceux de l'hôte.
      - /usr/src/app/apps/backend-gateway/node_modules

    environment:
      - NODE_ENV=${NODE_ENV}
      # Secrets chargés (plus tard via Vault, pour l'instant via env ou défaut)
      - API_PORT=3000

    ports:
      - "3000:3000" # Accès direct pour le débuggage (optionnel, Nginx expose le 443)

    networks:
      - transcendence-net

    depends_on:
      vault-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

# ==============================================================================
# DÉFINITION DES VOLUMES
# ==============================================================================
volumes:
  # Données persistantes (Disque Dur)
  rabbitmq_data:

  # Données partagées (Certificats)
  certs_data:
  
  # --- VOLUME RAM (TMPFS) ---
  # Ce volume est stocké EXCLUSIVEMENT en Mémoire Vive.
  # Les fichiers écrits ici (mots de passe DB, clés API) :
  # 1. Ne sont jamais écrits sur le disque dur de l'hôte.
  # 2. Sont perdus instantanément si les conteneurs s'arrêtent.
  # C'est une mesure de sécurité "Zero Trust" pour le développement local.
  secrets_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=10m" # Limite de taille pour éviter de saturer la RAM

# ==============================================================================
# RÉSEAUX
# ==============================================================================
networks:
  transcendence-net:
    driver: bridge