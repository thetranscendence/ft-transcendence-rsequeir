services:
  # ==============================================================================
  # SERVICE: HASHICORP VAULT
  # Module: Cybersecurity (Gestion des secrets & PKI)
  # Description: Serveur de gestion de secrets lancé en mode développement.
  # ==============================================================================
  vault:
    # Utilisation d'une version spécifique (1.13.3) pour assurer la stabilité et
    # éviter les surprises (breaking changes) liées au tag 'latest'.
    image: hashicorp/vault:1.13.3
    container_name: vault

    # Exposition du port 8200 pour l'accès API et l'interface web (UI) depuis l'hôte
    ports:
      - "8200:8200"

    
    environment:
      # --------------------------------------------------------------------------
      # CONFIGURATION DE DÉVELOPPEMENT
      # --------------------------------------------------------------------------
      # Injection du token "Root" depuis le fichier .env.
      # Permet de respecter la consigne de ne pas commiter de secrets.
      # [Ref Subject: IV.4 Security concerns - "Publicly stored credentials..."]
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_ROOT_TOKEN}
      
      # Configuration réseau : écoute sur 0.0.0.0 pour être accessible
      # par les autres conteneurs du réseau Docker.
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      
      # Adresse explicite pour l'API interne (client CLI local).
      - VAULT_API_ADDR=http://127.0.0.1:8200
    
    # --------------------------------------------------------------------------
    # SÉCURITÉ SYSTÈME
    # --------------------------------------------------------------------------
    # IPC_LOCK : Permet au processus de verrouiller la mémoire vive (mloc).
    # Empêche le système d'écrire des secrets sensibles (stockés en RAM)
    # sur le disque dur via le mécanisme de SWAP.
    cap_add:
      - IPC_LOCK 
    
    # --------------------------------------------------------------------------
    # COMMANDE DE DÉMARRAGE
    # --------------------------------------------------------------------------
    # server -dev : Lance Vault en mode développement.
    # - Stockage 100% en mémoire (inmem)
    # - Auto-Unseal (déverrouillage automatique au démarrage)
    # - UI activée par défaut
    command: server -dev

  # ==============================================================================
  # SERVICE: VAULT INIT (AUTOMATISATION)
  # Description: Service éphémère. Génère les secrets/certs et s'arrête.
  # ==============================================================================
  vault-init:
    image: hashicorp/vault:1.13.3
    container_name: vault_init
    restart: "no"

    # On installe jq pour le parsing JSON dans le script, puis on lance l'init
    entrypoint: >
      /bin/sh -c "apk add --no-cache jq openssl && chmod +x /scripts/init_vault.sh && /scripts/init_vault.sh"

    environment:
      # Token pour se connecter à Vault et le configurer
      - VAULT_ROOT_TOKEN=${VAULT_ROOT_TOKEN}
      # Inputs non sensibles pour la génération des configs
      - RABBITMQ_USER=${RABBITMQ_USER}
      - POSTGRES_USER=${POSTGRES_USER}
      - NODE_ENV=${NODE_ENV}

    volumes:
      # Montage du script d'initialisation (chemin relatif au docker-compose.yml)
      - ./vault/init_vault.sh:/scripts/init_vault.sh
      # Volumes de sortie pour les certs et secrets
      - certs_data:/shared/certs
      - secrets_data:/shared/secrets

    depends_on:
      - vault

  # ==============================================================================
  # SERVICE: RABBITMQ
  # Module: Devops (Microservices Communication)
  # Description: Broker de messages pour la communication asynchrone.
  # ==============================================================================
  rabbitmq:
    # Utilisation de la version "management" pour avoir l'interface web incluse.
    image: rabbitmq:3.13-management
    container_name: rabbitmq

    # Définition du hostname pour une résolution DNS interne stable
    hostname: rabbitmq

    ports:
      - "5672:5672"   # Port standard AMQP (utilisé par les microservices)
      - "15672:15672" # Interface de gestion Web (http://localhost:15672)

    environment:
      # L'utilisateur est public (défini dans .env)
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      # On indique à RabbitMQ de lire le mot de passe dans un fichier
      # situé sur le volume RAM (tmpfs). Pas de mot de passe en clair ici.
      - RABBITMQ_DEFAULT_PASS=/shared/secrets/rabbitmq_password

    volumes:
      # Persistance des données (files d'attente, messages non consommées)
      - rabbitmq_data:/var/lib/rabbitmq
      # Montage en lecture seule (:ro) des secrets générés par vault-init
      - secrets_data:/shared/secrets:ro

    # Healthcheck : S'assure que le broker est prêt à accepter des connexions
    # Indispensable pour que les microservices attendent avant de se connecter.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    # On attend que vault-init ait terminé (et donc créé le fichier de mot de passe)
    depends_on:
      vault-init:
        condition: service_completed_successfully

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  rabbitmq_data:
  certs_data:
  # Volume en MÉMOIRE VIVE (RAM)
  # Les données écrites ici disparaissent à l'arrêt des conteneurs.
  # Cela garantit qu'aucun mot de passe ne traîne sur le disque dur.
  secrets_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=10m"